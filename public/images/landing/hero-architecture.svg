<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="tore-hero-illustration-title">
  <title id="tore-hero-illustration-title">Орчин үеийн шилэн барилга дээр эрх зүйн тэнцвэрийн бэлгэдэл, цэнхэр агаар мандалтай</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE9FA" />
      <stop offset="45%" stop-color="#EAF1FB" />
      <stop offset="100%" stop-color="#F6F9FD" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%" stop-color="#1B3A63" />
      <stop offset="55%" stop-color="#122C4E" />
      <stop offset="100%" stop-color="#0A1E38" />
    </linearGradient>
    <linearGradient id="glassSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1E38" />
      <stop offset="100%" stop-color="#061527" />
    </linearGradient>
    <radialGradient id="haze" cx="72%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#C7DBF6" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#C7DBF6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#haze)" />

  <!-- distant mountain ridgeline, snow-capped for a highland Mongolian feel -->
  <path d="M0 520 L140 470 300 510 460 450 640 505 820 460 1000 515 1180 465 1360 512 1600 480 L1600 900 0 900 Z" fill="#CFE0F5" opacity="0.55" />
  <g fill="#F2F7FD" opacity="0.9">
    <path d="M600 500 L640 488 680 502 646 508 Z" />
    <path d="M900 468 L942 456 984 470 950 476 Z" />
    <path d="M1200 508 L1240 495 1278 510 1246 516 Z" />
  </g>
  <path d="M0 580 L200 540 420 575 620 530 840 578 1060 535 1280 580 1600 545 L1600 900 0 900 Z" fill="#BCD3F0" opacity="0.55" />

  <!-- low city skyline, flanking the main tower within the visible crop -->
  <g fill="#AEC6EA" opacity="0.75">
    <rect x="540" y="660" width="46" height="180" />
    <rect x="600" y="700" width="34" height="140" />
    <rect x="655" y="670" width="40" height="170" />
    <rect x="705" y="720" width="30" height="120" />
    <rect x="1320" y="650" width="42" height="190" />
    <rect x="1378" y="695" width="36" height="145" />
  </g>
  <g fill="#8FAEDC" opacity="0.6">
    <rect x="575" y="720" width="18" height="120" />
    <rect x="1360" y="730" width="20" height="110" />
  </g>

  <!-- low tree line, bottom-left foreground -->
  <g fill="#0F2C48" opacity="0.9">
    <ellipse cx="70" cy="760" rx="70" ry="90" />
    <ellipse cx="150" cy="790" rx="90" ry="110" />
    <ellipse cx="40" cy="810" rx="60" ry="80" />
  </g>

  <!-- main glass tower, angled twin-facade tower -->
  <g>
    <!-- front facade (angled) -->
    <polygon points="760,900 780,180 1080,240 1120,900" fill="url(#glass)" />
    <!-- side facade (darker, receding) -->
    <polygon points="1080,240 1120,900 1310,900 1240,270" fill="url(#glassSide)" />

    <!-- front facade mullion grid -->
    <g stroke="#3E6096" stroke-width="2" opacity="0.55">
      <line x1="826" y1="205" x2="800" y2="900" />
      <line x1="872" y1="212" x2="856" y2="900" />
      <line x1="918" y1="219" x2="912" y2="900" />
      <line x1="964" y1="226" x2="968" y2="900" />
      <line x1="1010" y1="233" x2="1024" y2="900" />
      <line x1="1056" y1="238" x2="1080" y2="900" />
    </g>
    <g stroke="#3E6096" stroke-width="1.5" opacity="0.4">
      <line x1="763" y1="300" x2="1096" y2="345" />
      <line x1="765" y1="400" x2="1104" y2="440" />
      <line x1="768" y1="500" x2="1108" y2="535" />
      <line x1="770" y1="600" x2="1112" y2="630" />
      <line x1="773" y1="700" x2="1116" y2="725" />
      <line x1="776" y1="800" x2="1119" y2="815" />
    </g>

    <!-- side facade mullion grid -->
    <g stroke="#0D2440" stroke-width="2" opacity="0.6">
      <line x1="1140" y1="290" x2="1160" y2="900" />
      <line x1="1175" y1="305" x2="1210" y2="900" />
      <line x1="1210" y1="320" x2="1258" y2="900" />
    </g>

    <!-- entrance / base plinth -->
    <rect x="740" y="878" width="600" height="22" fill="#081729" />
  </g>

  <!-- large scales-of-justice etched on the glass facade -->
  <g transform="translate(940 470)" stroke="#8FB4DD" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85">
    <line x1="0" y1="-70" x2="0" y2="70" />
    <line x1="-95" y1="-46" x2="95" y2="-46" />
    <path d="M-95 -46 L-135 20 A46 30 0 0 0 -55 20 Z" />
    <path d="M95 -46 L55 20 A46 30 0 0 0 135 20 Z" />
    <circle cx="0" cy="-70" r="9" fill="#8FB4DD" stroke="none" />
    <line x1="-46" y1="70" x2="46" y2="70" />
    <path d="M-24 92 L24 92 L14 108 L-14 108 Z" fill="#8FB4DD" stroke="none" opacity="0.8" />
  </g>

  <!-- soft atmospheric fade toward the left / lower edge for text legibility -->
  <rect width="1600" height="900" fill="url(#haze)" opacity="0.25" />
</svg>
