<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tore-hero-illustration-title">
  <title id="tore-hero-illustration-title">Орчин үеийн хууль зүйн байгууллагын архитектур, цэнхэр агаар мандалтай</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF1FB" />
      <stop offset="55%" stop-color="#F3F7FC" />
      <stop offset="100%" stop-color="#FBFCFE" />
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#CFE0FA" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#CFE0FA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="72%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16345C" />
      <stop offset="100%" stop-color="#0B1F3A" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7EFFA" stop-opacity="0" />
      <stop offset="100%" stop-color="#DCE6F5" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="900" height="1000" fill="url(#sky)" />
  <rect width="900" height="1000" fill="url(#glow)" />

  <!-- distant mountain ridgelines (Ulaanbaatar basin atmosphere) -->
  <path d="M0 620 L90 560 180 600 260 545 360 605 460 555 560 610 660 565 760 615 860 575 900 600 L900 1000 0 1000 Z" fill="#D7E4F6" opacity="0.55" />
  <path d="M0 680 L120 630 240 670 340 615 450 665 560 620 680 672 800 630 900 665 L900 1000 0 1000 Z" fill="#C7D9F0" opacity="0.5" />

  <!-- low city silhouette for urban/institutional context -->
  <g fill="#B9CDE9" opacity="0.65">
    <rect x="70" y="700" width="34" height="120" />
    <rect x="118" y="670" width="26" height="150" />
    <rect x="600" y="690" width="30" height="130" />
    <rect x="646" y="655" width="24" height="165" />
    <rect x="700" y="705" width="40" height="115" />
    <rect x="760" y="675" width="22" height="145" />
  </g>

  <!-- ground / plaza -->
  <rect x="0" y="800" width="900" height="200" fill="url(#ground)" />

  <!-- main institutional building -->
  <g>
    <!-- base plinth -->
    <rect x="330" y="795" width="360" height="22" fill="#0B1F3A" opacity="0.9" />
    <!-- tower body -->
    <rect x="352" y="330" width="316" height="470" fill="url(#tower)" />
    <!-- cornice / pediment -->
    <path d="M340 330 L510 250 680 330 Z" fill="#0F284A" />
    <rect x="336" y="322" width="336" height="14" fill="#0B1F3A" />

    <!-- vertical column lines (modern-classical facade) -->
    <g stroke="#3E6096" stroke-width="3" opacity="0.85">
      <line x1="384" y1="336" x2="384" y2="795" />
      <line x1="428" y1="336" x2="428" y2="795" />
      <line x1="472" y1="336" x2="472" y2="795" />
      <line x1="516" y1="336" x2="516" y2="795" />
      <line x1="560" y1="336" x2="560" y2="795" />
      <line x1="604" y1="336" x2="604" y2="795" />
      <line x1="648" y1="336" x2="648" y2="795" />
    </g>

    <!-- glass facade floor lines -->
    <g stroke="#274B7D" stroke-width="1.5" opacity="0.5">
      <line x1="352" y1="410" x2="668" y2="410" />
      <line x1="352" y1="480" x2="668" y2="480" />
      <line x1="352" y1="550" x2="668" y2="550" />
      <line x1="352" y1="620" x2="668" y2="620" />
      <line x1="352" y1="690" x2="668" y2="690" />
      <line x1="352" y1="760" x2="668" y2="760" />
    </g>

    <!-- entrance steps -->
    <g fill="#0B1F3A" opacity="0.9">
      <rect x="470" y="780" width="80" height="15" />
      <rect x="462" y="795" width="96" height="14" opacity="0.8" />
    </g>
  </g>

  <!-- subtle scales-of-justice emblem on the pediment -->
  <g transform="translate(510 288)" stroke="#C8A45D" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-16" x2="0" y2="14" />
    <line x1="-24" y1="-8" x2="24" y2="-8" />
    <path d="M-24 -8 L-34 8 A12 8 0 0 0 -14 8 Z" />
    <path d="M24 -8 L14 8 A12 8 0 0 0 34 8 Z" />
    <circle cx="0" cy="-16" r="3" fill="#C8A45D" stroke="none" />
    <line x1="-10" y1="14" x2="10" y2="14" />
  </g>

  <!-- soft foreground fade so the illustration blends into the text column -->
  <rect width="900" height="1000" fill="url(#fadeLeft)" />
</svg>
